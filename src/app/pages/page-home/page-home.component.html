<div [ngStyle]="{ backgroundColor: colorBody(color) }">
  <div>
    <div class="d-flex">
      <!--
    <button [title]="monTitle" (click)="displayDiv()">
    Afficher la Div avec mon logo dedans !
  </button>
  <div *ngIf="isDivDisplayed">
    <img src="assets/logo.png" />
  </div>
-->

      <div id="testRandom">
        <app-filter-side-bar
          [categoriesToDisplay]="categoriesToSend"
          (categoriesToFilter)="filterPlantsByCategories($event)"
          (sendColorBody)="colorBody(color)"
          (sendReset)="resetAllColors()"
        ></app-filter-side-bar>
      </div>

      <div>
        <div>
          <app-search-bar
            (envoiDuClick)="openingModal()"
            (myrtilleVersParent)="filterPlantsByText($event)"
            class="searchDesign"
          ></app-search-bar>
        </div>

        <div>
          <app-filter-buttons
            (alphabetic_btn)="sortByAlphabetic($event)"
            (reset_btn)="resetAlpha($event)"
            (sunny_btn)="sortBySunshine($event)"
            (water_btn)="sortByWater($event)"
          ></app-filter-buttons>
        </div>

        <div class="container-plants">
          <app-card-plant
            class="one-plant"
            *ngFor="let plantData of plantsToDisplay"
            [plant]="plantData"
          ></app-card-plant>
        </div>
      </div>
    </div>
  </div>
</div>

<dialog class="role" [style.background-color]="'grey'">
  <div class="design-Modal">
    <form [formGroup]="formRole" (ngSubmit)="submitFormRole(roleChoisi)">
      <div>
        <div>
          <label>Choisissez votre rôle : </label>

          <select formControlName="roleToChoose">
            <option [ngValue]="null" disabled>Choisissez...</option>
            <option
              #roleSelected
              type="text"
              *ngFor="let r of roleVals() | keyvalue"
              [ngValue]="r.value"
            >
              {{ r.key }} - {{ r.value }}
            </option>
          </select>

          <span class="bouton"
            ><button id="confirm" type="submit">
              Valider et enregistrer dans le LS
            </button></span
          >
        </div>
      </div>
      <div>
        <div class="close">
          <button id="modal-close-button" type="button" (click)="closeModal()">
            <app-icones
              [iconName]="'x-circle'"
              [iconColor]="'white'"
              [iconSize]="2"
            ></app-icones>
          </button>
        </div>
      </div>
    </form>
  </div>
</dialog>
